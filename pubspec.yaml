name: new_app
description: "Flutter boilerplate — Clean Architecture + GetX + Dio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  get: ^4.6.6

  # HTTP client
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Responsive
  responsive_framework: ^1.4.0
  flutter_screenutil: ^5.9.3

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Utils
  logger: ^2.4.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.3
  device_info_plus: ^11.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Mocking
  mocktail: ^1.0.4

  # Golden tests — use matchesGoldenFile() from flutter_test (built-in)

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    # - assets/fonts/   # ← uncomment after adding font files

  # fonts:
  #   - family: AppFont                           # ← add your font files to assets/fonts/
  #     fonts:
  #       - asset: assets/fonts/AppFont-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/AppFont-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/AppFont-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/AppFont-Bold.ttf
  #         weight: 700
